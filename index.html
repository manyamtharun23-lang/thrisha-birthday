<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thrisha Birthday Surprise</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#ff4d6d,#7b2cbf,#4cc9f0);
      background-size: 400% 400%;
      animation: bg 10s ease infinite;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }.card {
  width: 85%;
  max-width: 420px;
  padding: 30px;
  border-radius: 25px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  text-align: center;
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
  animation: fade 1s ease;
}

h1 {
  font-size: 2.2rem;
}

p {
  font-size: 1.1rem;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  padding: 12px 24px;
  border: none;
  border-radius: 30px;
  font-size: 1rem;
  cursor: pointer;
  background: white;
  color: #7b2cbf;
  font-weight: bold;
}

.hidden {
  display: none;
}

@keyframes fade {
  from { opacity:0; transform:scale(0.9); }
  to { opacity:1; transform:scale(1); }
}

@keyframes bg {
  0% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100% { background-position:0% 50%; }
}

  </style>
</head>
<body>  <div class="card" id="step1">
    <h1>Hey Thrisha ✨</h1>
    <p>I have something for you 🎁</p>
    <button onclick="nextStep(1,2)">Open</button>
  </div>  <div class="card hidden" id="step2">
    <h1>Mission For Today 🌸</h1>
    <p>
      ☑ Smile a lot 😄<br>
      ☑ Eat your favorite food 🍕<br>
      ☑ Stay happy always ✨
    </p>
    <button onclick="nextStep(2,3)">Next</button>
  </div>  <div class="card hidden" id="step3">
    <h1>One More Thing 💖</h1>
    <p>
      The world became better the day you were born 🌍✨
    </p>
    <button onclick="nextStep(3,4)">Final Surprise</button>
  </div>  <div class="card hidden" id="step4">
    <h1>🎂 Happy Birthday Thrisha 🎂</h1>
    <p>
      Many More Happy Returns Of The Day 🤍<br><br>
      Stay the amazing person you are ✨
    </p>
    <button onclick="alert('Made with ❤️ just for you')">❤️</button>
  </div>  <script>
    function nextStep(current, next) {
      document.getElementById('step' + current).classList.add('hidden');
      document.getElementById('step' + next).classList.remove('hidden');
    }
  </script></body>
</html>
